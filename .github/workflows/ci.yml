name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "dev/**"

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Check Python dependency consistency
        run: python -m pip check

      - name: Check workflow artifact projection
        run: python -m tests.workflow_cross_field.artifacts --check

      - name: Check SyntheticLib trade compatibility artifacts
        run: |
          git ls-files --error-unmatch \
            syntheticlib-trade/compatibility/compatibility-matrix.json \
            syntheticlib-trade/compatibility/moto-contract-test-result.json \
            syntheticlib-trade/compatibility/moto-compatibility-receipt.json \
            syntheticlib-trade/compatibility/moto-compatibility-receipt.sha256 \
            syntheticlib-trade/compatibility/frozen-asset-manifest.json \
            syntheticlib-trade/compatibility/compatibility-bundle-manifest.json \
            syntheticlib-trade/compatibility/moto-preflight-attestation.json \
            syntheticlib-trade/compatibility/MOTO_COMPATIBILITY_RECEIPT.md
          python -m scripts.check_syntheticlib_trade_contract --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies for Vitest selector evidence
        run: npm ci --prefix frontend

      - name: Run Python tests
        run: python -m pytest

  windows-native-lifecycle:
    name: Windows native Chroma lifecycle
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Check SyntheticLib trade compatibility artifacts
        run: python -m scripts.check_syntheticlib_trade_contract --check

      - name: Run SyntheticLib compatibility regressions
        run: >-
          python -m pytest
          tests/unit/test_syntheticlib_trade_compatibility.py
          tests/integration/test_syntheticlib_trade_contract_command.py
          tests/unit/test_local_syntheticlib_compatibility_ci.py

      - name: Run native and lifecycle race regressions
        run: >-
          python -m pytest
          tests/regressions/test_chroma_native_lifecycle.py
          tests/regressions/test_rag_clear_bounded.py
          tests/unit/test_chroma_cache_cleanup.py
          tests/test_workflow_start_guard_ownership.py

  codeql-new-alerts:
    name: CodeQL (no new alerts vs main)
    # CodeQL default setup only scans pull requests into main. This repeats its
    # analyses on every dev push and fails on alerts main does not have; results
    # stay in the log and are never uploaded, so default setup is unaffected.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch main as the baseline
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve baseline tree
        id: baseline
        run: echo "tree=$(git rev-parse 'origin/main^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Restore cached baseline results
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/moto-codeql/results
          key: codeql-results-${{ steps.baseline.outputs.tree }}

      - name: Run CodeQL against the main baseline
        run: python -m scripts.run_codeql --no-fetch --install-if-missing

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Retries only a failed advisory-service request; vulnerabilities fail at once.
      - name: Audit production frontend dependencies
        working-directory: .
        run: python -m scripts.run_npm_audit

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:browser

      - name: Upload browser smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7
